# Piece-Meal-DnD — Bard subclass fragment: College of Lore
#
# SRD reference bard college (the default merged into the web build). Only the
# college features, keyed by level; spliced onto data/bard.yaml.
#   python3 tools/price.py data/bard.yaml \
#       --subclass data/subclasses/bard/lore.yaml --check

attaches_to: bard
subclass: College of Lore
source: "SRD 5.1 (CC-BY-4.0)"
default: true

pieces:
  3:
    - id: cutting-words
      name: "College of Lore: Cutting Words"
      summary: "Reaction: spend a Bardic Inspiration die to subtract it from a nearby creature's attack roll, ability check or damage roll."
      tag: marquee
      points: 5
    - id: lore-bonus-proficiencies
      name: "College of Lore: Bonus Proficiencies"
      summary: "Gain proficiency in three skills of your choice."
      tag: proficiency
      points: 2
  6:
    - id: additional-magical-secrets
      name: "College of Lore: Additional Magical Secrets"
      summary: "Learn two spells from any class's spell list early; they count as bard spells."
      tag: marquee
      points: 5
  14:
    - id: peerless-skill
      name: "College of Lore: Peerless Skill"
      summary: "Spend a Bardic Inspiration die to add it to one of your own ability checks."
      tag: utility
      points: 3
