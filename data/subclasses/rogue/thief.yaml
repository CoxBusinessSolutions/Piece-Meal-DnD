# Piece-Meal-DnD — Rogue subclass fragment: Thief
#
# SRD reference roguish archetype (the default merged into the web build). Only
# the archetype features, keyed by level; spliced onto data/rogue.yaml.
#   python3 tools/price.py data/rogue.yaml \
#       --subclass data/subclasses/rogue/thief.yaml --check

attaches_to: rogue
subclass: Thief
source: "SRD 5.1 (CC-BY-4.0)"
default: true

pieces:
  3:
    - id: archetype-fast-hands
      name: "Thief: Fast Hands"
      summary: "Cunning Action can also make a Sleight of Hand check, use thieves' tools, or take the Use an Object action."
      tag: utility
      points: 3
    - id: archetype-second-story-work
      name: "Thief: Second-Story Work"
      summary: "Climbing costs no extra movement, and running jumps go farther by your Dexterity modifier in feet."
      tag: proficiency
      points: 2
  9:
    - id: archetype-supreme-sneak
      name: "Thief: Supreme Sneak"
      summary: "Advantage on Stealth checks if you move no more than half your speed on the turn."
      tag: utility
      points: 3
  13:
    - id: archetype-use-magic-device
      name: "Thief: Use Magic Device"
      summary: "Ignore all class, race and level requirements for using magic items."
      tag: utility
      points: 3
  17:
    - id: archetype-thiefs-reflexes
      name: "Thief: Thief's Reflexes"
      summary: "Take two turns in the first round of combat: your normal turn and a second at initiative minus 10."
      tag: marquee
      points: 5
