# Piece-Meal-DnD — Sorcerer subclass fragment: Draconic Bloodline
#
# SRD reference sorcerous origin (the default merged into the web build). Only
# the origin features, keyed by level; spliced onto data/sorcerer.yaml. Origin
# features begin at level 1, so two of these split the creation budget.
#   python3 tools/price.py data/sorcerer.yaml \
#       --subclass data/subclasses/sorcerer/draconic.yaml --check

attaches_to: sorcerer
subclass: Draconic Bloodline
source: "SRD 5.1 (CC-BY-4.0)"
default: true

pieces:
  1:
    - id: draconic-resilience
      name: "Draconic Bloodline: Draconic Resilience"
      summary: "Your HP maximum rises by 1 per sorcerer level, and without armor your AC is 13 + Dexterity modifier."
      tag: utility
      points: 3
    - id: dragon-ancestor
      name: "Draconic Bloodline: Dragon Ancestor"
      summary: "Choose a dragon type for its damage type; you speak Draconic and double proficiency on Charisma checks with dragons."
      tag: ribbon
      points: 1
  6:
    - id: elemental-affinity
      name: "Draconic Bloodline: Elemental Affinity"
      summary: "Add your Charisma modifier to one damage roll of spells matching your ancestry's type, and spend 1 sorcery point for 1 hour of resistance to it."
      tag: marquee
      points: 5
  14:
    - id: dragon-wings
      name: "Draconic Bloodline: Dragon Wings"
      summary: "Bonus action: sprout dragon wings and gain a flying speed equal to your speed."
      tag: marquee
      points: 5
  18:
    - id: draconic-presence
      name: "Draconic Bloodline: Draconic Presence"
      summary: "Spend 5 sorcery points for a 60-foot aura of awe or fear for 1 minute (Wisdom save)."
      tag: marquee
      points: 5
