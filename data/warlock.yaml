# Piece-Meal-DnD — Warlock (BASE chassis; subclasses in data/subclasses/warlock/)
#
# PACT MAGIC — a third caster shape. Instead of a full spell-slot table, the
# Warlock has a handful of short-rest slots that all rise to the same level:
# 1st@1, 2nd@3, 3rd@5, 4th@7, 5th@9 (the slot-LEVEL chain, `spellcasting`
# pieces). The slot COUNT grows separately, as in the SRD table: 1 slot at 1, a
# 2nd at 2, a 3rd at 11 and a 4th at 17 (the slot-COUNT chain, `slots` pieces,
# each upgrading the last). High-level spells
# come from Mystic Arcanum (a free 6th/7th/8th/9th spell at 11/13/15/17), each
# a spellcasting piece chained to the last. Eldritch Invocations are their own
# buyable system: the first pick unlocks the feature, later picks are scaling
# upgrade-pieces at every level the invocations-known count rises.

class: Warlock
source: "SRD 5.1 (CC-BY-4.0)"
hit_die: d8
caster: pact

xp_thresholds:
  1: 0
  2: 300
  3: 900
  4: 2700
  5: 6500
  6: 14000
  7: 23000
  8: 34000
  9: 48000
  10: 64000
  11: 85000
  12: 100000
  13: 120000
  14: 140000
  15: 165000
  16: 195000
  17: 225000
  18: 265000
  19: 305000
  20: 355000

rubric:
  ribbon: 1
  proficiency: 2
  hp: 2
  utility: 3
  scaling: 3
  slots: 3
  asi: 4
  marquee: 5
  spellcasting: 5

levels:
