    # Character-creation budget (100 experience). Unlike the half-casters, the
    # Warlock casts from level 1 — Pact Magic is part of the starting package.
    note: Character-creation budget (100 experience); earned XP starts at 0 in play.
    pieces:
      # --- Commodities (fixed catalog price, shared across classes) ---
      - id: save-wis
        name: "Saving Throw Proficiency: Wisdom"
        commodity: save
        ability: wis
      - id: save-cha
        name: "Saving Throw Proficiency: Charisma"
        commodity: save
        ability: cha
      - id: skills-1
        name: "Skill Proficiencies (choose 2)"
        commodity: skill
        qty: 2
      - id: hit-die-1
        name: "Hit Die (d8)"
        commodity: hit_die
        variant: d8
      - id: armor-1
        name: "Armor Proficiency: light"
        commodity: armor
        tiers: [light]
      - id: weapons-1
        name: "Weapons: simple"
        commodity: weapon
        tier: simple
      - id: starting-kit-1
        name: "Starting Equipment Package"
        commodity: starting_kit
      # --- Unique features (split the remaining budget by points) ---
      - id: pact-magic
        name: "Pact Magic (1st-level spell slots)"
        summary: "Cast known warlock spells using Charisma. A few spell slots, all at the same level, recover on a short or long rest."
        tag: spellcasting
        points: 5
      - id: cantrips-known-2
        name: "Cantrips Known (2)"
        tag: proficiency
        points: 2
