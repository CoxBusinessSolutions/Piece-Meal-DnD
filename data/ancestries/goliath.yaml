  - {id: con-1, name: "Goliath: +1 Constitution (house rule)", commodity: ability, ability: con, amount: 1}
  - {id: giant-ancestry, name: "Giant Ancestry", tag: marquee, points: 5}
  - {id: powerful-build, name: "Powerful Build", tag: ribbon, points: 1}
