# Piece-Meal-DnD — Ranger (BASE chassis; subclasses in data/subclasses/ranger/)
#
# The second HALF-CASTER. Same spell schedule as the Paladin (spellcasting from
# level 2, tiers at 2/5/9/13/17, capping at 5th). Its exploration features
# (Favored Enemy, Natural Explorer) grow as upgrade-chains, and the Hunter
# archetype's pick-one packages (Hunter's Prey, Defensive Tactics, Multiattack,
# Superior Hunter's Defense) are each a single marquee piece.

class: Ranger
source: "SRD 5.1 (CC-BY-4.0)"
hit_die: d10
caster: half

xp_thresholds:
  1: 0
  2: 300
  3: 900
  4: 2700
  5: 6500
  6: 14000
  7: 23000
  8: 34000
  9: 48000
  10: 64000
  11: 85000
  12: 100000
  13: 120000
  14: 140000
  15: 165000
  16: 195000
  17: 225000
  18: 265000
  19: 305000
  20: 355000

rubric:
  ribbon: 1
  proficiency: 2
  hp: 2
  utility: 3
  scaling: 3
  slots: 3
  asi: 4
  marquee: 5
  spellcasting: 5

levels:
  1:
    # Character-creation budget (100 experience). No spellcasting yet — a
    # half-caster's magic is bought starting at level 2.
    note: Character-creation budget (100 experience); earned XP starts at 0 in play.
    pieces:
      # --- Commodities (fixed catalog price, shared across classes) ---
      - id: save-str
        name: "Saving Throw Proficiency: Strength"
        commodity: save
        ability: str
      - id: save-dex
        name: "Saving Throw Proficiency: Dexterity"
        commodity: save
        ability: dex
      - id: skills-1
        name: "Skill Proficiencies (choose 3)"
        commodity: skill
        qty: 3
      - id: hit-die-1
        name: "Hit Die (d10)"
        commodity: hit_die
        variant: d10
      - id: armor-1
        name: "Armor Proficiency: light, medium, shields"
        commodity: armor
        tiers: [light, medium, shield]
      - id: weapons-1
        name: "Weapons: simple + martial"
        commodity: weapon
        tier: simple_and_martial
      - id: starting-kit-1
        name: "Starting Equipment Package"
        commodity: starting_kit
      # --- Unique features (split the remaining budget by points) ---
      - id: favored-enemy
        name: "Favored Enemy"
        summary: "Pick a favored enemy type: advantage on Survival to track them and Intelligence checks to recall lore about them, plus one of their languages."
        tag: utility
        points: 3
      - id: natural-explorer
        name: "Natural Explorer"
        summary: "Pick a favored terrain: double proficiency on related checks, and travel there is faster, safer and better foraged."
        tag: utility
        points: 3
  2:
    pieces:
      - id: fighting-style
        name: "Fighting Style"
        summary: "Adopt one fighting style, such as Archery (+2 ranged attacks), Defense or Two-Weapon Fighting."
        tag: marquee
        points: 5
      - id: spellcasting
        name: "Spellcasting (1st-level spells)"
        summary: "Cast known ranger spells using Wisdom, with spell slots that recover on a long rest."
        tag: spellcasting
        points: 5
      - id: hp-2
        name: "Hit Points (d10)"
        tag: hp
        points: 2
  3:
    pieces:
      - id: primeval-awareness
        name: "Primeval Awareness"
        summary: "Spend a spell slot to sense certain creature types within 1 mile (6 in favored terrain) for 1 minute per slot level."
        tag: utility
        points: 3
      - id: hp-3
        name: "Hit Points (d10)"
        tag: hp
        points: 2
  4:
