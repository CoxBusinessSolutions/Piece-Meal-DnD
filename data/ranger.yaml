        tag: marquee
        points: 5
      - id: spell-tier-2nd
        name: "Spellcasting: 2nd-level spells"
        tag: spellcasting
        points: 5
        upgrades: spellcasting
      - id: proficiency-bonus-5
        name: "Proficiency Bonus +1 (to +3)"
        tag: proficiency
        points: 2
      - id: hp-5
        name: "Hit Points (d10)"
        tag: hp
        points: 2
  6:
